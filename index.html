<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Cyber Threat Map</title>
<style>
  :root{
    --bg:#03060c; --red:#ff2a4d; --cyan:#00f0ff; --text:#cfe9ee; --dim:#7a959e;
    --glass:rgba(8,16,26,.58); --edge:rgba(0,240,255,.25);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden;
    font-family:"SF Mono","Cascadia Mono",Consolas,Menlo,monospace}
  #globe{position:fixed;inset:0;touch-action:none}
  #globe canvas{display:block;cursor:grab}
  #globe canvas:active{cursor:grabbing}

  #panel{position:fixed;top:16px;left:16px;bottom:16px;width:350px;max-width:calc(100vw - 32px);
    display:flex;flex-direction:column;gap:12px;padding:16px;
    background:var(--glass);border:1px solid var(--edge);border-radius:14px;
    backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);
    box-shadow:0 0 40px rgba(0,240,255,.08), inset 0 0 30px rgba(255,42,77,.04);z-index:5}
  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  h1{font-size:15px;font-weight:600;letter-spacing:.08em;color:var(--cyan);text-shadow:0 0 10px rgba(0,240,255,.5)}
  .sub{font-size:11px;color:var(--dim);margin-top:3px}
  .btns{display:flex;gap:6px;flex-shrink:0}
  .btns button{font:inherit;font-size:11px;color:var(--cyan);background:rgba(0,240,255,.08);
    border:1px solid var(--edge);border-radius:8px;padding:6px 9px;cursor:pointer;min-height:30px}
  .btns button[aria-pressed="true"]{background:rgba(0,240,255,.25);color:#fff}
  .btns button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
  .counter{padding:11px 14px;border:1px solid rgba(255,42,77,.35);border-radius:10px;background:rgba(255,42,77,.07)}
  .counter .label{font-size:11px;color:var(--dim)}
  .counter .num{font-size:38px;line-height:1.1;font-weight:700;color:var(--red);text-shadow:0 0 18px rgba(255,42,77,.7)}
  .counter .meta{font-size:11px;color:var(--dim);margin-top:2px}
  .legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:10.5px;color:var(--dim)}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
  .legend i.on{background:var(--red);box-shadow:0 0 6px var(--red)}
  .legend i.off{background:#a35a69}
  .legend i.tg{background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
  h2{font-size:12px;font-weight:600;color:var(--cyan);display:flex;align-items:center;gap:8px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red);animation:blink 1.2s infinite}
  @keyframes blink{50%{opacity:.25}}
  #feed{flex:1;overflow-y:auto;list-style:none;font-size:11.5px;line-height:1.45;min-height:0;
    scrollbar-width:thin;scrollbar-color:var(--edge) transparent;margin-right:-6px;padding-right:6px}
  #feed li{padding:7px 0 7px 10px;border-left:2px solid var(--red);margin-bottom:6px;background:linear-gradient(90deg,rgba(255,42,77,.09),transparent)}
  #feed li.offline{border-color:#a35a69;background:linear-gradient(90deg,rgba(163,90,105,.08),transparent)}
  #feed li.new{animation:flash .9s ease-out}
  @keyframes flash{from{background:rgba(0,240,255,.35)}}
  #feed li b{color:var(--red);font-weight:600}
  #feed li.offline b{color:#c98a98}
  #feed li span{color:var(--cyan)}
  #feed li small{display:block;color:var(--dim);font-size:10.5px}
  #feed li.sys{border-color:var(--cyan);background:none;color:var(--dim)}
  #feed li.err{border-color:#ffb020;color:#ffb020;background:none}
  #status{font-size:11px;color:var(--dim);display:flex;justify-content:space-between;gap:8px}
  #status em{font-style:normal;color:var(--cyan)}

  #panel.collapsed{bottom:auto;height:auto;gap:8px}
  #panel.collapsed .counter,#panel.collapsed .legend,#panel.collapsed h2,#panel.collapsed #feed{display:none}

  @media (max-width:640px){
    #panel{top:auto;height:40vh;bottom:8px;left:8px;right:8px;width:auto;max-width:none;padding:12px;gap:8px}
    #panel.collapsed{height:auto;top:auto}
    .counter .num{font-size:30px}
    .sub{display:none}
  }
  @media (prefers-reduced-motion:reduce){.dot,#feed li.new{animation:none}}
</style>
</head>
<body>
<div id="globe"></div>

<aside id="panel">
  <div class="head">
    <div>
      <h1>CYBER THREAT MAP</h1>
      <div class="sub">Botnet C2 servers · Feodo Tracker (abuse.ch)</div>
    </div>
    <div class="btns">
      <button id="sound" aria-pressed="false" title="Toggle cyber sound">Sound off</button>
      <button id="fold" aria-label="Collapse panel" title="Collapse panel">–</button>
    </div>
  </div>
  <div class="counter">
    <div class="label">Total Active Threats (online C2)</div>
    <div class="num" id="total">0</div>
    <div class="meta" id="meta">waiting for data…</div>
  </div>
  <div class="legend">
    <span><i class="on"></i>online</span>
    <span><i class="off"></i>offline</span>
    <span><i class="tg"></i><span id="tgname">target</span></span>
  </div>
  <h2><span class="dot"></span>Live Threat Feed</h2>
  <ul id="feed"></ul>
  <div id="status"><span id="stat">Starting…</span><span>Next sync <em id="timer">--:--</em></span></div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  "use strict";

  /* ---------- Config ---------- */
  const FEODO_URL = "https://feodotracker.abuse.ch/downloads/ipblocklist.json";
  const PROXIES = [
    u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
    u => "https://corsproxy.io/?" + encodeURIComponent(u)
  ];
  // Your own Cloudflare Worker that forwards the Feodo JSON with CORS headers.
  const FEODO_PROXY = "https://threat-proxy.akijelectronic.workers.dev/feodo";
  const REFRESH_MS = 5 * 60 * 1000;
  const EARTH_TEXTURES = [
    "https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg",
    "https://unpkg.com/three-globe/example/img/earth-dark.jpg"
  ];
  const FALLBACK_TARGET = { lat: 23.81, lon: 90.41, name: "Dhaka, Bangladesh" };
  const MAX_FEED = 120;
  const $ = id => document.getElementById(id);

  /* ---------- State ---------- */
  const geoCache = new Map();
  try {
    const saved = JSON.parse(localStorage.getItem("threatGeoCache") || "{}");
    Object.entries(saved).forEach(([k, v]) => geoCache.set(k, v));
  } catch (_) {}
  const plotted = new Map();   // ip -> { sprite, line, packet, curve, online, born, phase, speed, last }
  let target = null;           // { lat, lon, name }
  let targetMarker = null, targetFlash = 0;
  let nextSync = Date.now() + REFRESH_MS;
  let running = false;

  /* ---------- UI helpers ---------- */
  function feed(html, cls) {
    const li = document.createElement("li");
    li.className = (cls || "") + (cls && cls !== "offline" ? "" : " new");
    li.innerHTML = html;
    const list = $("feed");
    list.prepend(li);
    while (list.children.length > MAX_FEED) list.lastChild.remove();
  }
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const setStat = t => $("stat").textContent = t;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const isOnline = item => String(item.status).toLowerCase() === "online";

  async function fetchJSON(url, opts, timeout = 20000) {
    let timer;
    const limit = new Promise((_, rej) => { timer = setTimeout(() => rej(new Error("Request timed out")), timeout); });
    try {
      const res = await Promise.race([fetch(url, opts || {}), limit]);
      if (!res.ok) throw new Error("HTTP " + res.status);
      return await Promise.race([res.json(), limit]);
    } finally { clearTimeout(timer); }
  }

  function updateCounter(listed) {
    let on = 0;
    plotted.forEach(e => { if (e.online) on++; });
    $("total").textContent = on;
    if (listed != null) $("meta").textContent = `${listed} C2 servers listed · ${plotted.size - on} offline`;
  }

  /* Panel controls */
  const panel = $("panel");
  if (matchMedia("(max-width:640px)").matches) { /* start expanded; user can fold it */ }
  $("fold").addEventListener("click", () => {
    const c = panel.classList.toggle("collapsed");
    $("fold").textContent = c ? "+" : "–";
    $("fold").setAttribute("aria-label", c ? "Expand panel" : "Collapse panel");
  });

  /* ---------- Cyber sound (synthesized, no files) ---------- */
  let ac = null, master = null, soundOn = false, lastSfx = 0, lastArrive = 0;
  function initAudio() {
    if (ac) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
    // low sci-fi drone with a slowly sweeping filter
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 240;
    const dg = ac.createGain(); dg.gain.value = 0.35; lp.connect(dg); dg.connect(master);
    [[55, "sawtooth", .5], [55.45, "sawtooth", .5], [82.4, "sine", .4]].forEach(([f, type, v]) => {
      const o = ac.createOscillator(); o.type = type; o.frequency.value = f;
      const g = ac.createGain(); g.gain.value = v; o.connect(g); g.connect(lp); o.start();
    });
    const lfo = ac.createOscillator(); lfo.frequency.value = 0.12;
    const lg = ac.createGain(); lg.gain.value = 110; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
  }
  function tone(type, f0, f1, dur, vol, delay = 0) {
    if (!soundOn || !ac) return;
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  const sfx = {
    threat(online) {                       // new C2 detected
      const now = performance.now(); if (now - lastSfx < 140) return; lastSfx = now;
      if (online) { tone("square", 1320, 520, .14, .5); tone("sine", 660, 330, .22, .45, .09); }
      else tone("triangle", 520, 300, .16, .3);
    },
    arrive() {                             // data packet reaches the target
      const now = performance.now(); if (now - lastArrive < 500) return; lastArrive = now;
      tone("sine", 1800, 900, .09, .22);
    },
    sync() { tone("sawtooth", 180, 1400, .55, .3); }
  };
  $("sound").addEventListener("click", () => {
    initAudio();
    if (!ac) return;
    soundOn = !soundOn;
    if (ac.state === "suspended") ac.resume();
    master.gain.cancelScheduledValues(ac.currentTime);
    master.gain.linearRampToValueAtTime(soundOn ? 0.18 : 0, ac.currentTime + 0.3);
    $("sound").textContent = soundOn ? "Sound on" : "Sound off";
    $("sound").setAttribute("aria-pressed", String(soundOn));
    if (soundOn) sfx.sync();
  });

  /* ---------- 3D globe ---------- */
  const host = $("globe");
  if (typeof THREE === "undefined") {
    feed("Three.js failed to load. Check your connection.", "err");
    return;
  }
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
  const baseZ = () => (innerWidth / innerHeight < 0.8 ? 4.4 : 3.4);
  camera.position.set(0, 0, baseZ());
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  host.appendChild(renderer.domElement);

  const world = new THREE.Group();
  scene.add(world);

  const earthMat = new THREE.MeshBasicMaterial({ color: 0x0a1c2a });
  world.add(new THREE.Mesh(new THREE.SphereGeometry(1, 64, 64), earthMat));
  (function loadEarth(i) {
    if (i >= EARTH_TEXTURES.length) {          // no texture: fall back to a lat/long grid
      world.add(new THREE.Mesh(new THREE.SphereGeometry(1.001, 36, 18),
        new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true, transparent: true, opacity: .18 })));
      return;
    }
    new THREE.TextureLoader().setCrossOrigin("anonymous").load(
      EARTH_TEXTURES[i],
      tex => {
        earthMat.map = tex;
        earthMat.color.set(i === 0 ? 0x5a8fb0 : 0xffffff);  // tint daylight map into a cool, dark-ish blue
        earthMat.needsUpdate = true;
      },
      undefined,
      () => loadEarth(i + 1)
    );
  })(0);

  scene.add(new THREE.Mesh(
    new THREE.SphereGeometry(1.14, 64, 64),
    new THREE.ShaderMaterial({
      transparent: true, side: THREE.BackSide, blending: THREE.AdditiveBlending, depthWrite: false,
      vertexShader: "varying vec3 n;void main(){n=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}",
      fragmentShader: "varying vec3 n;void main(){float i=pow(0.62-dot(n,vec3(0,0,1.)),3.);gl_FragColor=vec4(0.,.94,1.,1.)*i;}"
    })
  ));

  {
    const g = new THREE.BufferGeometry(), p = [];
    for (let i = 0; i < 900; i++) {
      const r = 20 + Math.random() * 30, a = Math.random() * 6.283, b = Math.acos(2 * Math.random() - 1);
      p.push(r * Math.sin(b) * Math.cos(a), r * Math.sin(b) * Math.sin(a), r * Math.cos(b));
    }
    g.setAttribute("position", new THREE.Float32BufferAttribute(p, 3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0x88aabb, size: .07, sizeAttenuation: true })));
  }

  function makeGlow(inner, mid, outer) {
    const c = document.createElement("canvas"); c.width = c.height = 64;
    const x = c.getContext("2d"), g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, "rgba(255,255,255,1)");
    g.addColorStop(.18, inner);
    g.addColorStop(.5, mid);
    g.addColorStop(1, outer);
    x.fillStyle = g; x.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  }
  const redGlow = makeGlow("rgba(255,60,90,1)", "rgba(255,42,77,.35)", "rgba(255,42,77,0)");
  const cyanGlow = makeGlow("rgba(0,240,255,1)", "rgba(0,240,255,.35)", "rgba(0,240,255,0)");

  function latLonToVec3(lat, lon, r) {
    const phi = (90 - lat) * Math.PI / 180, theta = (lon + 180) * Math.PI / 180;
    return new THREE.Vector3(-r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta));
  }

  function faceLatLon(lat, lon) {              // turn the globe so a point faces the camera
    const v = latLonToVec3(lat, lon, 1);
    world.rotation.y = -Math.atan2(v.x, v.z);
    world.rotation.x = Math.max(-1.1, Math.min(1.1, lat * Math.PI / 180));
  }

  function setTarget(t) {
    target = t;
    $("tgname").textContent = "target: " + t.name;
    if (targetMarker) world.remove(targetMarker);
    targetMarker = new THREE.Sprite(new THREE.SpriteMaterial({
      map: cyanGlow, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
    }));
    targetMarker.position.copy(latLonToVec3(t.lat, t.lon, 1.012));
    targetMarker.scale.setScalar(0.1);
    world.add(targetMarker);
  }

  function styleEntry(e) {
    e.sprite.material.color.set(e.online ? 0xff2a4d : 0xb06a7a);
    e.line.material.opacity = e.online ? 0.8 : 0.22;
    e.packet.material.opacity = e.online ? 1 : 0.4;
    e.speed = e.online ? 0.26 : 0.1;
  }

  function plot(ip, geo, online) {
    if (plotted.has(ip)) return;
    const from = latLonToVec3(geo.lat, geo.lon, 1.012);

    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
      map: redGlow, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
    }));
    sprite.position.copy(from);
    sprite.scale.setScalar(0.001);
    world.add(sprite);

    // attack arc: C2 server -> target, red at the source fading to cyan at the target
    const to = latLonToVec3(target.lat, target.lon, 1.012);
    const ang = from.angleTo(to);
    let ctrl = from.clone().add(to);
    if (ctrl.length() < 0.01) ctrl = from.clone().cross(new THREE.Vector3(0, 1, 0));
    ctrl.normalize().multiplyScalar(1.15 + 1.0 * ang / Math.PI);
    const curve = new THREE.QuadraticBezierCurve3(from, ctrl, to);
    const pts = curve.getPoints(64), cols = [];
    pts.forEach((_, i) => { const t = i / 64; cols.push(1 - t * 1, 0.16 + t * 0.78, 0.3 + t * 0.7); });
    const geom = new THREE.BufferGeometry().setFromPoints(pts);
    geom.setAttribute("color", new THREE.Float32BufferAttribute(cols, 3));
    const line = new THREE.Line(geom, new THREE.LineBasicMaterial({
      vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
    }));
    world.add(line);

    const packet = new THREE.Sprite(new THREE.SpriteMaterial({
      map: cyanGlow, color: 0xbffcff, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
    }));
    packet.scale.setScalar(0.07);
    world.add(packet);

    const e = { sprite, line, packet, curve, online, born: clock.getElapsedTime(), phase: Math.random(), speed: 0.2, last: 0 };
    styleEntry(e);
    plotted.set(ip, e);
  }

  function unplot(ip) {
    const e = plotted.get(ip); if (!e) return;
    [e.sprite, e.line, e.packet].forEach(o => { world.remove(o); if (o.geometry) o.geometry.dispose(); });
    plotted.delete(ip);
  }

  /* ---------- Interaction ---------- */
  let dragging = false, lx = 0, ly = 0;
  const el = renderer.domElement;
  el.addEventListener("pointerdown", e => { dragging = true; lx = e.clientX; ly = e.clientY; el.setPointerCapture(e.pointerId); });
  el.addEventListener("pointermove", e => {
    if (!dragging) return;
    world.rotation.y += (e.clientX - lx) * 0.005;
    world.rotation.x = Math.max(-1.2, Math.min(1.2, world.rotation.x + (e.clientY - ly) * 0.005));
    lx = e.clientX; ly = e.clientY;
  });
  el.addEventListener("pointerup", () => dragging = false);
  el.addEventListener("pointercancel", () => dragging = false);
  el.addEventListener("wheel", e => {
    e.preventDefault();
    camera.position.z = Math.max(1.8, Math.min(7, camera.position.z + e.deltaY * 0.002));
  }, { passive: false });
  addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const clock = new THREE.Clock();
  (function loop() {
    requestAnimationFrame(loop);
    const t = clock.getElapsedTime();
    if (!dragging && !reduceMotion) world.rotation.y += 0.0012;

    plotted.forEach(e => {
      const k = 0.5 + 0.5 * Math.sin(t * 2.4 + e.phase * 6.283);          // pulse 0..1
      const grow = Math.min(1, (t - e.born) * 2.5);
      const size = e.online ? 0.10 + 0.07 * k : 0.055 + 0.03 * k;
      e.sprite.scale.setScalar(size * grow);
      e.sprite.material.opacity = e.online ? 0.65 + 0.35 * k : 0.4 + 0.25 * k;

      const raw = (t * e.speed + e.phase) % 1;                            // data packet along the arc
      e.packet.position.copy(e.curve.getPoint(raw));
      e.packet.scale.setScalar((e.online ? 0.075 : 0.05) * (0.8 + 0.4 * k));
      if (raw < e.last && e.online) { targetFlash = 1; sfx.arrive(); }
      e.last = raw;
    });

    if (targetMarker) {
      targetMarker.scale.setScalar(0.1 + 0.025 * Math.sin(t * 3) + 0.14 * targetFlash);
      targetFlash *= 0.93;
    }
    renderer.render(scene, camera);
  })();

  /* ---------- Data: Feodo Tracker ---------- */
  async function loadFeodo() {
    const attempts = [];
    if (FEODO_PROXY) attempts.push(["your Worker", FEODO_PROXY]);
    attempts.push(["direct", FEODO_URL]);
    PROXIES.forEach((p, i) => attempts.push(["proxy " + (i + 1), p(FEODO_URL)]));
    for (const [name, url] of attempts) {
      try {
        setStat("Fetching Feodo (" + name + ")…");
        const data = await fetchJSON(url, {}, 10000);
        const list = Array.isArray(data) ? data : (data.blocklist || data.data || []);
        if (!Array.isArray(list)) throw new Error("Unexpected response format");
        return list.filter(x => x && x.ip_address);
      } catch (e) {
        feed("Feodo via " + esc(name) + " failed: " + esc(e.message), "err");
      }
    }
    throw new Error("all Feodo sources failed");
  }

  /* ---------- Data: geolocation ---------- */
  // ip-api.com's free tier is HTTP-only, so on an HTTPS page we use ipwho.is instead.
  const canUseIpApi = location.protocol === "http:" || location.protocol === "file:";

  async function geolocate(ips) {
    const todo = ips.filter(ip => !geoCache.has(ip));
    if (!todo.length) return;

    if (canUseIpApi) {
      for (let i = 0; i < todo.length; i += 100) {
        const chunk = todo.slice(i, i + 100);
        setStat(`Geolocating ${Math.min(i + 100, todo.length)}/${todo.length}…`);
        try {
          const res = await fetchJSON(
            "http://ip-api.com/batch?fields=status,message,country,lat,lon,query",
            { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(chunk) }
          );
          res.forEach(r => { if (r.status === "success") geoCache.set(r.query, { lat: r.lat, lon: r.lon, country: r.country }); });
        } catch (e) {
          feed(`Geolocation batch failed: ${esc(e.message)}`, "err");
          if (/429/.test(e.message)) await sleep(60000);
        }
        if (i + 100 < todo.length) await sleep(4500);
      }
    } else {
      let done = 0;
      const worker = async () => {
        while (todo.length) {
          const ip = todo.shift();
          try {
            const r = await fetchJSON("https://ipwho.is/" + encodeURIComponent(ip), {}, 10000);
            if (r.success) geoCache.set(ip, { lat: r.latitude, lon: r.longitude, country: r.country });
          } catch (_) { /* skip this IP */ }
          setStat(`Geolocating… ${++done}`);
          await sleep(120);
        }
      };
      await Promise.all([worker(), worker(), worker()]);
    }
    try { localStorage.setItem("threatGeoCache", JSON.stringify(Object.fromEntries(geoCache))); } catch (_) {}
  }

  /* The arc target is the viewer's own approximate location (the monitoring point). */
  async function resolveTarget() {
    if (target) return;
    try {
      const r = await fetchJSON("https://ipwho.is/", {}, 8000);
      if (!r.success) throw new Error("lookup failed");
      setTarget({ lat: r.latitude, lon: r.longitude, name: (r.city ? r.city + ", " : "") + r.country });
    } catch (_) {
      setTarget(FALLBACK_TARGET);
    }
    faceLatLon(target.lat, target.lon);
  }

  /* ---------- Main sync ---------- */
  async function sync() {
    if (running) return;
    running = true;
    nextSync = Date.now() + REFRESH_MS;
    setStat("Fetching Feodo Tracker…");
    try {
      await resolveTarget();
      const list = await loadFeodo();
      feed(`Feodo Tracker synced: ${list.length} C2 servers.`, "sys");
      sfx.sync();

      await geolocate(list.map(x => x.ip_address));

      const alive = new Set(list.map(x => x.ip_address));
      for (const ip of [...plotted.keys()]) if (!alive.has(ip)) unplot(ip);
      list.forEach(item => {                                   // status may have changed since last sync
        const e = plotted.get(item.ip_address);
        if (e && e.online !== isOnline(item)) { e.online = isOnline(item); styleEntry(e); }
      });
      updateCounter(list.length);

      const fresh = list.filter(x => !plotted.has(x.ip_address) && geoCache.has(x.ip_address));
      for (const item of fresh) {
        const geo = geoCache.get(item.ip_address), online = isOnline(item);
        plot(item.ip_address, geo, online);
        const extra = [item.malware, item.port && ("port " + item.port), online ? "online" : "offline"].filter(Boolean).join(" · ");
        feed(`<b>C2 Server</b> detected in <span>${esc(geo.country || item.country || "Unknown")}</span> ` +
             `(IP: ${esc(item.ip_address)})<small>${esc(extra)} → ${esc(target.name)}</small>`, online ? "" : "offline");
        sfx.threat(online);
        updateCounter(list.length);
        await sleep(reduceMotion ? 0 : 140);
      }
      updateCounter(list.length);
      const missed = list.filter(x => !plotted.has(x.ip_address)).length;
      setStat(missed > 0 ? `Live · ${missed} IPs couldn’t be located` : "Live");
    } catch (e) {
      console.error(e);
      feed(`Could not load threat data: ${esc(e.message)}. Retrying at next sync.`, "err");
      setStat("Error: retrying at next sync");
    } finally {
      running = false;
    }
  }

  setInterval(() => {
    const left = Math.max(0, nextSync - Date.now());
    $("timer").textContent = String(Math.floor(left / 60000)).padStart(2, "0") + ":" +
                             String(Math.floor(left / 1000) % 60).padStart(2, "0");
  }, 1000);
  setInterval(sync, REFRESH_MS);
  sync();
})();
</script>
